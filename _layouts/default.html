<!DOCTYPE html>
{%- assign t = site.data.i18n[page.lang] -%}
<html lang="{{ page.lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }} · {{ t.hero.kicker }}{% endif %}</title>
  <meta name="description" content="{{ t.hero.subtitle | strip_newlines | truncate: 160 }}">
  {%- for l in site.languages %}
  <link rel="alternate" hreflang="{{ l }}" href="{{ site.url }}{{ page.translations[l] }}">
  {%- endfor %}
  <link rel="icon" href="{{ '/assets/img/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  {% include header.html t=t %}
  <main>
    {{ content }}
  </main>
  {% include footer.html t=t %}
  <script src="{{ '/assets/js/main.js' | relative_url }}"></script>
</body>
</html>
