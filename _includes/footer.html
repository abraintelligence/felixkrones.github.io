{%- assign t = include.t -%}
<footer class="site-footer">
  <div class="container footer-inner">
    <span>© 2026 {{ site.title }}. {{ t.footer.rights }}</span>
    <nav>
      {%- comment -%} Imprint link is hidden until the company details exist; re-add it here. {%- endcomment -%}
      <a href="{{ site.data.paths[page.lang].privacy | relative_url }}">{{ t.footer.privacy }}</a>
    </nav>
  </div>
</footer>
