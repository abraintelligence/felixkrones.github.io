{%- assign t = include.t -%}
<section class="section contact">
  <div class="container">
    <h1>{{ t.contact.title }}</h1>
    <p class="section-sub">{{ t.contact.text }}</p>
    <form id="contact-form" action="https://formsubmit.co/{{ site.formsubmit_endpoint }}" method="POST">
      <input type="hidden" name="_subject" value="{{ t.contact.mail_subject }}">
      <input type="hidden" name="_template" value="table">
      <input type="hidden" name="_captcha" value="false">
      <input type="hidden" name="_next" value="{{ page.url | absolute_url }}?sent=1">
      <input type="text" name="_honey" style="display:none" tabindex="-1" autocomplete="off">
      <label>{{ t.contact.name_label }}
        <input type="text" name="name" required>
      </label>
      <label>{{ t.contact.email_label }}
        <input type="email" name="email" required>
      </label>
      <label>{{ t.contact.message_label }}
        <textarea name="message" rows="5" required></textarea>
      </label>
      <p class="form-success" hidden>{{ t.contact.success }}</p>
      <button type="submit" class="btn btn-primary">{{ t.contact.submit }}</button>
    </form>
  </div>
</section>
