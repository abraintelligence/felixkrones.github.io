  title: "Fehler dort erkennen, wo sie entstehen: An der Linie"
  subtitle: >-
    Aikvora verbindet Smart Glasses mit KI und unterstützt Menschen in der Produktion:
    Montagefehler erkennen, falsch platzierte Teile finden und jeden Schritt dokumentieren, freihändig.
  cta_primary: Beratungstermin buchen
how:
  title: So funktioniert es
  steps:
    - name: Erfassen
      text: Die Smart Glasses sehen, was die Mitarbeitenden sehen. Keine zusätzlichen Kameras, keine Umbauten an der Linie.
    - name: Prüfen
      text: Die KI vergleicht jeden Schritt in Echtzeit mit dem Soll-Prozess und meldet Abweichungen.
    - name: Unterstützen
      text: Mitarbeitende erhalten direkt klares Feedback, und jeder Schritt wird automatisch dokumentiert.
use_cases:
  title: Anwendungsfälle
  items:
    - name: Unterstützung der Line Clearance
      text: >-
        Verbleibende Teile erkennen und Kontamination vermeiden. Die KI unterstützt
        die technische Inspektion vor dem Wiederanlauf der Linie.
    - name: Geführte Fehlersuche
      text: >-
        Kontextbasierte SOP-Anleitung hilft, Störungen schneller zu lösen, und
        unterstützt Suche und Dokumentation.
    - name: Produktionsrundgang
      text: >-
        Checkpoints werden automatisch erfasst. Rundgänge werden verlässlich und
        die Dokumentation läuft nebenbei mit.
