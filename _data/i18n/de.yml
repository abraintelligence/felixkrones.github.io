meta_description: >-
  Kontextbezogene KI für manuelle Tätigkeiten: Abra sieht, was die Mitarbeitenden
  sehen, kennt den Ablauf und erkennt Fehler, bevor sie teuer werden.
hero:
  kicker: Kontextbezogene KI für manuelle Tätigkeiten
  title: KI, die manuelle Arbeit in Echtzeit unterstützt
  subtitle: >-
    Wie die Arbeit richtig gemacht wird, steht im SOP-Ordner oder steckt im Kopf
    erfahrener Fachkräfte. Abra bringt dieses Wissen direkt an den Arbeitsplatz:
    Es sieht, was die Mitarbeitenden sehen, kennt den Ablauf und erkennt Fehler,
    bevor sie teuer werden.
  cta_primary: 20-Minuten-Demo buchen
how:
  title: So funktioniert es
  steps:
    - name: Kontext
      text: >-
        Abra erhält SOPs, Handbücher, Sprachnotizen von Fachleuten und eine
        Aufnahme der richtig ausgeführten Arbeit. Eingerichtet in Tagen statt Monaten.
    - name: Sehen
      text: Abra sieht die Arbeit über Smart Glasses, ein Smartphone oder eine Bodycam.
    - name: Erkennen
      text: >-
        Abra meldet in Echtzeit einen fehlenden Schritt, ein falsches Teil oder
        einen vergessenen Gegenstand und dokumentiert jeden Schritt automatisch.
  trust:
    title: Unterstützung statt Kontrolle
    text: keine individuelle Leistungsbewertung, die Entscheidung liegt immer bei den Mitarbeitenden.
use_cases:
  title: Anwendungsfälle
  items:
    - name: Prozessmonitoring
      text: >-
        Sehen, ob SOPs Schritt für Schritt eingehalten werden, und Abweichungen
        sofort erkennen.
    - name: Geführte Fehlersuche
      text: >-
        Kontextbasierte SOP-Anleitung hilft, Störungen schneller zu lösen, und
        unterstützt Suche und Dokumentation.
    - name: Line Clearance
      text: >-
        Verbleibende Teile erkennen und Kontamination vermeiden. Die KI unterstützt
        die technische Inspektion vor dem Wiederanlauf der Linie.
    - name: SOP-Erstellung
      text: >-
        Aus Aufnahmen der echten Arbeit entstehen SOP-Entwürfe, die Dokumentation
        hält mit dem Prozess Schritt.
    - name: Arbeitssicherheit
      text: >-
        Eine Warnung, bevor ein sicherheitskritischer Fehler passiert, nicht danach.
    - name: Freihändige Dokumentation
      text: >-
        Ergebnisse einsprechen und das ausgefüllte Protokoll erhalten.
