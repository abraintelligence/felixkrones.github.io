meta_description: >-
  Contextual AI for hands-on work: Abra sees what the worker sees, knows the
  procedure and catches mistakes before they cost you.
hero:
  kicker: Contextual AI for hands-on work
  # "hands‑on" below uses a non-breaking hyphen (U+2011) so the headline never breaks after "hands-".
  title: AI that supports hands‑on work as it happens
  subtitle: >-
    The right way to do the job lives in an SOP binder or in an expert's head.
    Abra brings it to the job: it sees what the worker sees, knows the procedure,
    and catches mistakes before they cost you.
  cta_primary: Book a 20-minute demo
how:
  title: How it works
  steps:
    - name: Context
      text: >-
        Give it the SOPs, manuals, expert voice notes and a recording of the job
        done right. Set up in days, not months.
    - name: See
      text: It sees the work through smart glasses, a phone or a body camera.
    - name: Catch
      text: >-
        It flags a missed step, a wrong part or a leftover item in real time, and
        documents every step automatically.
  trust:
    title: Support, not surveillance
    text: no individual performance scoring, the operator always decides.
use_cases:
  title: Use cases
  items:
    - name: Process monitoring
      text: >-
        See whether SOPs are followed step by step and spot deviations as they happen.
    - name: Guided troubleshooting
      text: >-
        Context-based SOP guidance helps workers resolve disruptions faster and
        supports search and documentation.
    - name: Line clearance
      text: >-
        Detect remaining items and avoid contamination. AI supports the technical
        inspection before the line restarts.
    - name: SOP generation
      text: >-
        Turn recordings of the real work into SOP drafts, so documentation keeps
        up with the process.
    - name: Worker safety
      text: >-
        An alert before a safety-critical mistake happens, not after.
    - name: Hands-free documentation
      text: >-
        Speak the results and get the filled-in protocol.
