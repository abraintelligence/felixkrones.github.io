hero:
  kicker: Smart glasses for production
  title: "Catch errors where they happen: On the line"
  subtitle: >-
    Abra Intelligence combines smart glasses with AI to support people in production:
    spot assembly errors, detect misplaced items and document every step, hands-free.
  cta_primary: Book a 20-minute demo
how:
  title: How it works
  steps:
    - name: Capture
      text: The smart glasses see what the worker sees. No extra cameras, no changes to the line.
    - name: Check
      text: AI compares each step against the target process in real time and flags deviations.
    - name: Support
      text: Workers get clear feedback on the spot, and every step is documented automatically.
use_cases:
  title: Use cases
  items:
    - name: Process monitoring
      text: >-
        See whether SOPs are followed step by step and spot deviations as they happen.
    - name: Guided troubleshooting
      text: >-
        Context-based SOP guidance helps workers resolve disruptions faster and
        supports search and documentation.
    - name: Line clearance
      text: >-
        Detect remaining items and avoid contamination. AI supports the technical
        inspection before the line restarts.
    - name: SOP generation
      text: >-
        Turn recordings of the real work into SOP drafts, so documentation keeps
        up with the process.
    - name: Worker safety
      text: >-
        An alert before a safety-critical mistake happens, not after.
    - name: Production rounds
      text: >-
        Checkpoints are captured automatically. Rounds become reliable and the
        documentation happens on the go.
