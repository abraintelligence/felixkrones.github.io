  title: "Wykrywaj błędy tam, gdzie powstają: Na linii"
  subtitle: >-
    Abra Intelligence łączy inteligentne okulary z AI i wspiera ludzi w produkcji:
    wykrywanie błędów montażu, znajdowanie źle umieszczonych elementów i
    dokumentowanie każdego kroku, bez użycia rąk.
  cta_primary: Umów 20-minutowe demo
how:
  title: Jak to działa
  steps:
    - name: Rejestrowanie
      text: Inteligentne okulary widzą to, co widzi pracownik. Bez dodatkowych kamer i bez zmian na linii.
    - name: Kontrola
      text: AI porównuje każdy krok z procesem docelowym w czasie rzeczywistym i zgłasza odchylenia.
    - name: Wsparcie
      text: Pracownicy od razu otrzymują jasne informacje zwrotne, a każdy krok jest automatycznie dokumentowany.
use_cases:
  title: Zastosowania
  items:
    - name: Monitorowanie procesu
      text: >-
        Sprawdzaj, czy procedury SOP są przestrzegane krok po kroku, i od razu
        wychwytuj odchylenia.
    - name: Prowadzona diagnostyka usterek
      text: >-
        Kontekstowe instrukcje SOP pomagają szybciej usuwać zakłócenia oraz
        wspierają wyszukiwanie informacji i dokumentację.
    - name: Line clearance
      text: >-
        Wykrywanie pozostałych elementów i unikanie zanieczyszczeń. AI wspiera
        kontrolę techniczną przed ponownym uruchomieniem linii.
    - name: Tworzenie SOP
      text: >-
        Z nagrań rzeczywistej pracy powstają projekty SOP, dokumentacja nadąża
        za procesem.
    - name: Bezpieczeństwo pracowników
      text: >-
        Ostrzeżenie, zanim dojdzie do błędu krytycznego dla bezpieczeństwa,
        a nie po fakcie.
    - name: Obchody produkcyjne
      text: >-
        Punkty kontrolne są rejestrowane automatycznie. Obchody stają się
        niezawodne, a dokumentacja powstaje na bieżąco.
