    - name: Rejestrowanie
      text: Inteligentne okulary widzą to, co widzi pracownik. Bez dodatkowych kamer i bez zmian na linii.
    - name: Kontrola
      text: AI porównuje każdy krok z procesem docelowym w czasie rzeczywistym i zgłasza odchylenia.
